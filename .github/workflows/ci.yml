name: Build and Deploy

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and create tag
        id: version
        run: |
          major=$(jq -r '.major' VERSION.json)
          minor=$(jq -r '.minor' VERSION.json)

          latest=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          current_patch=$(echo "$latest" | cut -d. -f3)
          new_patch=${current_patch:-0}
          new_patch=$((new_patch + 1))

          new_version="v${major}.${minor}.${new_patch}"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "New version: $new_version"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.version }}
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{ version }},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=semver,pattern={{ major }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Trigger staging deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: AstroLumina-DevOps
          event-type: deploy-staging
          client-payload: |
            {
              "service": "astrolumina-frontend",
              # "service": "astrolumina-astrologyapi",
              # "service": "astrolumina-paymentapi",
              # "service": "astrolumina-bookingapi",
              "tag": "${{ needs.version.outputs.version }}"
            }
