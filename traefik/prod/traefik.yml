global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  file:
    filename: /etc/traefik/dynamic/routes.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@astrolumina.com
      storage: /certs/acme.json
      httpChallenge:
        entryPoint: web
