# =============================================================================
# Traefik Dynamic Configuration
# =============================================================================

http:
  # ─────────────────────────────────────────────────────────────────────────────
  # Middleware = "filtre" aplicate pe request/response (chain-uri de procesare)
  # ─────────────────────────────────────────────────────────────────────────────
  middlewares:

    # Compresie HTTP (gzip / brotli dacă e suportat)
    # Reduce dimensiunea răspunsurilor → performanță mai bună în browser
    compress:
      compress: {}

    # Security headers (best practices pentru browser security)
    security-headers:
      headers:
        frameDeny: true              # blochează iframe (anti clickjacking)
        contentTypeNosniff: true     # previne MIME sniffing
        browserXssFilter: true       # protecție XSS (legacy, dar ok)
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"  # nu permite indexarea de către motoare

    # Rate limiting (protecție basic anti-abuz / DDoS light)
    rate-limit:
      rateLimit:
        average: 100   # requests/sec în medie acceptate
        burst: 50      # spike permis peste medie
        period: 1s     # intervalul de calcul

  # ─────────────────────────────────────────────────────────────────────────────
  # ROUTERS = decid unde merge traficul (matching pe Host, Path etc.)
  # ─────────────────────────────────────────────────────────────────────────────
  routers:

    # Router HTTP (port 80)
    frontend-http:
      rule: "Host(`astrolumina.localhost`)"  # match pe hostname
      entryPoints:
        - web                                # definit în static config (port 80)
      middlewares:
        - security-headers
        - compress
      service: frontend                      # trimite către serviciul "frontend"

    # Router HTTPS (port 443)
    frontend-https:
      rule: "Host(`astrolumina.localhost`)"
      entryPoints:
        - websecure                          # port 443
      middlewares:
        - security-headers
        - compress
      service: frontend
      tls:
        certResolver: letsencrypt            # folosește Let's Encrypt pentru TLS

  # ─────────────────────────────────────────────────────────────────────────────
  # SERVICES = unde trimite efectiv traficul (backend-uri)
  # ─────────────────────────────────────────────────────────────────────────────
  services:

    frontend:
      loadBalancer:
        servers:
          # ⚠️ IMPORTANT:
          # Aici Traefik NU servește fișiere statice.
          # El doar face reverse proxy către un server HTTP existent.
          - url: "http://localhost:80"