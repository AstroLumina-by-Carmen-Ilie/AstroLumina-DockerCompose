services:
  traefik:
    image: traefik:v3.6
    container_name: astrolumina-production-traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs
      - ./traefik/logs:/var/log/traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - astrolumina-production
    # Dashboard router (dashboard.dc.astrolumina.ro + basic-auth) lives here
    # as labels instead of routes.yml: compose interpolates
    # ${TRAEFIK_DASHBOARD_AUTH} from .env/Doppler, the file provider cannot.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.dc.astrolumina.ro`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

networks:
  astrolumina-production:
    name: astrolumina-production
    driver: bridge
