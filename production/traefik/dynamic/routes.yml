# =============================================================================
# Production routes — HTTPS with Let's Encrypt. The LIVE color is switched here:
# on each router, the `service:` field points to *-blue or *-green.
# Traefik reloads automatically (watch: true), no restart needed.
# Host: production.dc.astrolumina.ro (frontend + /api/*), dashboard.dc.astrolumina.ro
# =============================================================================
http:
  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_AUTH}"

    to-https:
      redirectScheme:
        scheme: https
        permanent: true

    compress:
      compress: {}

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    strip-astrology:
      stripPrefix:
        prefixes:
          - "/api/astrology"

    strip-payment:
      stripPrefix:
        prefixes:
          - "/api/payment"

    strip-booking:
      stripPrefix:
        prefixes:
          - "/api/booking"

  routers:
    catch-http:
      entryPoints: [web]
      rule: "Host(`production.dc.astrolumina.ro`)"
      middlewares: [to-https]
      service: noop

    astrology:
      entryPoints: [websecure]
      rule: "Host(`production.dc.astrolumina.ro`) && PathPrefix(`/api/astrology`)"
      middlewares:
        - security-headers
        - compress
        - strip-astrology
      tls:
        certResolver: letsencrypt
      service: astrology-blue # LIVE: change to astrology-green to switch

    booking:
      entryPoints: [websecure]
      rule: "Host(`production.dc.astrolumina.ro`) && PathPrefix(`/api/booking`)"
      middlewares:
        - security-headers
        - compress
        - strip-booking
      tls:
        certResolver: letsencrypt
      service: booking-blue # LIVE: change to booking-green to switch

    payment:
      entryPoints: [websecure]
      rule: "Host(`production.dc.astrolumina.ro`) && PathPrefix(`/api/payment`)"
      middlewares:
        - security-headers
        - compress
        - strip-payment
      tls:
        certResolver: letsencrypt
      service: payment-blue # LIVE: change to payment-green to switch

    frontend:
      rule: "Host(`production.dc.astrolumina.ro`)"
      entryPoints: [websecure]
      middlewares:
        - security-headers
        - compress
      tls:
        certResolver: letsencrypt
      service: frontend-blue # LIVE: change to frontend-green to switch

    dashboard:
      entryPoints: [websecure]
      rule: "Host(`dashboard.dc.astrolumina.ro`)"
      middlewares:
        - dashboard-auth
      tls:
        certResolver: letsencrypt
      service: api@internal

  services:
    astrology-blue:
      loadBalancer:
        servers:
          - url: "http://astrology-api-blue:3031"

    astrology-green:
      loadBalancer:
        servers:
          - url: "http://astrology-api-green:3031"

    booking-blue:
      loadBalancer:
        servers:
          - url: "http://booking-api-blue:3033"

    booking-green:
      loadBalancer:
        servers:
          - url: "http://booking-api-green:3033"

    payment-blue:
      loadBalancer:
        servers:
          - url: "http://payment-api-blue:3032"

    payment-green:
      loadBalancer:
        servers:
          - url: "http://payment-api-green:3032"

    frontend-blue:
      loadBalancer:
        servers:
          - url: "http://frontend-blue:80"

    frontend-green:
      loadBalancer:
        servers:
          - url: "http://frontend-green:80"

    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"
