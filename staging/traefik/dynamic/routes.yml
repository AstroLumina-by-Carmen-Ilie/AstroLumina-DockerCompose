# =============================================================================
# Staging routes — HTTP without TLS. The LIVE color is switched here:
# on each router, the `service:` field points to *-blue or *-green.
# Traefik reloads automatically (watch: true), no restart needed.
# Host: staging.dc.astrolumina.ro
# =============================================================================
http:
  middlewares:
    compress:
      compress: {}

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1s

    strip-astrology:
      stripPrefix:
        prefixes:
          - "/api/astrology"

    strip-payment:
      stripPrefix:
        prefixes:
          - "/api/payment"

    strip-booking:
      stripPrefix:
        prefixes:
          - "/api/booking"

  routers:
    astrology:
      entryPoints: [web]
      rule: "Host(`staging.dc.astrolumina.ro`) && PathPrefix(`/api/astrology`)"
      middlewares:
        - security-headers
        - compress
        - strip-astrology
      service: astrology-green # LIVE: change to astrology-green to switch

    booking:
      entryPoints: [web]
      rule: "Host(`staging.dc.astrolumina.ro`) && PathPrefix(`/api/booking`)"
      middlewares:
        - security-headers
        - compress
        - strip-booking
      service: booking-green # LIVE: change to booking-green to switch

    payment:
      entryPoints: [web]
      rule: "Host(`staging.dc.astrolumina.ro`) && PathPrefix(`/api/payment`)"
      middlewares:
        - security-headers
        - compress
        - strip-payment
      service: payment-green # LIVE: change to payment-green to switch

    frontend:
      entryPoints: [web]
      rule: "Host(`staging.dc.astrolumina.ro`)"
      middlewares:
        - security-headers
        - compress
      service: frontend-green # LIVE: change to frontend-green to switch

    dashboard:
      entryPoints: [web]
      rule: "Host(`dashboard.dc.astrolumina.ro`)"
      service: api@internal

  services:
    astrology-blue:
      loadBalancer:
        servers:
          - url: "http://astrology-api-blue:3031"

    astrology-green:
      loadBalancer:
        servers:
          - url: "http://astrology-api-green:3031"

    booking-blue:
      loadBalancer:
        servers:
          - url: "http://booking-api-blue:3033"

    booking-green:
      loadBalancer:
        servers:
          - url: "http://booking-api-green:3033"

    payment-blue:
      loadBalancer:
        servers:
          - url: "http://payment-api-blue:3032"

    payment-green:
      loadBalancer:
        servers:
          - url: "http://payment-api-green:3032"

    frontend-blue:
      loadBalancer:
        servers:
          - url: "http://frontend-blue:80"

    frontend-green:
      loadBalancer:
        servers:
          - url: "http://frontend-green:80"

    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"
