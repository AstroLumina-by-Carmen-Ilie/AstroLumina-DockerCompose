services:
  traefik:
    image: traefik:v3.6
    container_name: astrolumina-staging-traefik
    restart: unless-stopped
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs
      - ./traefik/logs:/var/log/traefik
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - astrolumina-staging

networks:
  astrolumina-staging:
    name: astrolumina-staging
    driver: bridge
