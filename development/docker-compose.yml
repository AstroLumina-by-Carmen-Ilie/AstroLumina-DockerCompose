services:
  frontend:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-frontend:${FRONTEND_TAG#v}
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - astrolumina-dev

  astrology-api:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-astrologyapi:${ASTROLOGY_API_TAG#v}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3031
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3031/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - astrolumina-dev

  booking-api:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-bookingapi:${BOOKING_API_TAG#v}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3033
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3033/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - astrolumina-dev

  payment-api:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-paymentapi:${PAYMENT_API_TAG#v}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3032
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3032/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - astrolumina-dev

networks:
  astrolumina-dev:
    name: astrolumina-dev
    driver: bridge