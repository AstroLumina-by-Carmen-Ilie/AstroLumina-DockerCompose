  astrolumina-astrology:
    name: astrolumina-astrology-network
    driver: bridge
  astrolumina-payment:
    name: astrolumina-payment-network
    driver: bridge
  astrolumina-booking:
    name: astrolumina-booking-network
    driver: bridge
  astrolumina-frontend:
    name: astrolumina-frontend-network
    driver: bridge