    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.booking-blue.rule=Host(`api.astrolumina.com`) && PathPrefix(`/bookings`)"
      - "traefik.http.routers.booking-blue.entrypoints=websecure"
      - "traefik.http.services.booking-blue.loadbalancer.server.port=3033"
