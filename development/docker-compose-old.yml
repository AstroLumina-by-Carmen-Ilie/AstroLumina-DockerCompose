services:
  traefik:
    image: traefik:v3.1
    container_name: astrolumina-traefik
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/certs:/certs:ro
      - ./traefik/logs:/var/log/traefik
    networks:
      - astrolumina-astrology
      - astrolumina-payment
      - astrolumina-booking
      - astrolumina-frontend
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - TZ=Europe/Bucharest
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"

  frontend:
    build:
      context: ../AstroLumina-Frontend
      dockerfile: Dockerfile
    container_name: astrolumina-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - astrolumina-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`astrolumina.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web,websecure"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.tls=true"

  astrology-api-blue:
    build:
      context: ../AstroLumina-AstrologyAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - ASTROLOGER_API_KEY=${ASTROLOGER_API_KEY}
      - ASTROLOGER_API_URL=https://astrology-api.p.rapidapi.com
      - CORS_ORIGINS=https://astrolumina.com,https://www.astrolumina.com
      - SENTRY_DSN=${SENTRY_DSN}
    networks:
      - astrolumina-astrology
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astrology-blue.rule=Host(`api.astrolumina.com`) && PathPrefix(`/astrology`)"
      - "traefik.http.routers.astrology-blue.entrypoints=websecure"
      - "traefik.http.services.astrology-blue.loadbalancer.server.port=3031"
      - "traefik.http.middlewares.astrology-blue-stripprefix.stripprefix.prefix=/astrology"
      - "traefik.http.routers.astrology-blue.tls=true"
      - "astrolumina.color=blue"

  astrology-api-green:
    build:
      context: ../AstroLumina-AstrologyAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - ASTROLOGER_API_KEY=${ASTROLOGER_API_KEY}
      - ASTROLOGER_API_URL=https://astrology-api.p.rapidapi.com
      - CORS_ORIGINS=https://astrolumina.com,https://www.astrolumina.com
      - SENTRY_DSN=${SENTRY_DSN}
    networks:
      - astrolumina-astrology
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.astrology-green.rule=Host(`api.astrolumina.com`) && PathPrefix(`/astrology`)"
      - "traefik.http.routers.astrology-green.entrypoints=websecure"
      - "traefik.http.services.astrology-green.loadbalancer.server.port=3031"
      - "traefik.http.middlewares.astrology-green-stripprefix.stripprefix.prefix=/astrology"
      - "traefik.http.routers.astrology-green.tls=true"
      - "astrolumina.color=green"

  payment-api-blue:
    build:
      context: ../AstroLumina-PaymentAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3032"
    environment:
      - NODE_ENV=production
      - PORT=3032
      - STRIPE_SK=${STRIPE_SK}
      - STRIPE_PK=${STRIPE_PK}
      - STRIPE_NATAL_CHART_PRICE=${STRIPE_NATAL_CHART_PRICE}
      - STRIPE_KARMIC_CHART_PRICE=${STRIPE_KARMIC_CHART_PRICE}
      - STRIPE_BOOKING_PRICE=${STRIPE_BOOKING_PRICE}
      - CORS_ORIGINS=https://astrolumina.com,https://www.astrolumina.com
      - SENTRY_DSN=${SENTRY_DSN}
    networks:
