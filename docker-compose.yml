services:
  traefik:
    image: traefik:v3.1
    container_name: payment-api-traefik
    restart: unless-stopped
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs
      - ./logs:/var/log/traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - payment-api

  payment-api-blue:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-paymentapi:2.0.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3032
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3032/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.125'
          memory: 128M
    networks:
      - payment-api

  payment-api-green:
    image: ghcr.io/astrolumina-by-carmen-ilie/astrolumina-paymentapi:2.0.1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3032
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3032/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.125'
          memory: 128M
    networks:
      - payment-api

networks:
  payment-api:
    name: payment-api-network
    driver: bridge
